naftiko: 1.0.0-alpha2
info:
  label: Rootly API — Users
  description: 'Rootly API — Users. 3 operations. Lead operation: List users. Self-contained Naftiko capability covering one
    Rootly business surface.'
  tags:
  - Rootly
  - Users
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROOTLY_API_KEY: ROOTLY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rootly-users
    baseUri: https://api.rootly.com/v1
    description: Rootly API — Users business capability. Self-contained, no shared references.
    resources:
    - name: users
      path: /users
      operations:
      - name: get
        method: GET
        description: List users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: users-id
      path: /users/{id}
      operations:
      - name: get
        method: GET
        description: Get user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patch
        method: PATCH
        description: Update user
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.ROOTLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rootly-users-rest
    port: 8080
    description: REST adapter for Rootly API — Users. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/users
      name: users
      description: REST surface for users.
      operations:
      - method: GET
        name: get
        description: List users
        call: rootly-users.get
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/users/{id}
      name: users-id
      description: REST surface for users-id.
      operations:
      - method: GET
        name: get
        description: Get user
        call: rootly-users.get
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: patch
        description: Update user
        call: rootly-users.patch
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rootly-users-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rootly API — Users. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-users
      description: List users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rootly-users.get
      outputParameters:
      - type: object
        mapping: $.
    - name: get-user
      description: Get user
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rootly-users.get
      outputParameters:
      - type: object
        mapping: $.
    - name: update-user
      description: Update user
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rootly-users.patch
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
