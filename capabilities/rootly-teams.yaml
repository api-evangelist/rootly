naftiko: 1.0.0-alpha2
info:
  label: Rootly API — Teams
  description: 'Rootly API — Teams. 4 operations. Lead operation: List teams. Self-contained Naftiko capability covering one
    Rootly business surface.'
  tags:
  - Rootly
  - Teams
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROOTLY_API_KEY: ROOTLY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rootly-teams
    baseUri: https://api.rootly.com/v1
    description: Rootly API — Teams business capability. Self-contained, no shared references.
    resources:
    - name: teams
      path: /teams
      operations:
      - name: get
        method: GET
        description: List teams
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: post
        method: POST
        description: Create team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: teams-id
      path: /teams/{id}
      operations:
      - name: get
        method: GET
        description: Get team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patch
        method: PATCH
        description: Update team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.ROOTLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rootly-teams-rest
    port: 8080
    description: REST adapter for Rootly API — Teams. One Spectral-compliant resource per consumed operation, prefixed with
      /v1.
    resources:
    - path: /v1/teams
      name: teams
      description: REST surface for teams.
      operations:
      - method: GET
        name: get
        description: List teams
        call: rootly-teams.get
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: post
        description: Create team
        call: rootly-teams.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/teams/{id}
      name: teams-id
      description: REST surface for teams-id.
      operations:
      - method: GET
        name: get
        description: Get team
        call: rootly-teams.get
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: patch
        description: Update team
        call: rootly-teams.patch
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rootly-teams-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rootly API — Teams. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-teams
      description: List teams
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rootly-teams.get
      outputParameters:
      - type: object
        mapping: $.
    - name: create-team
      description: Create team
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rootly-teams.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-team
      description: Get team
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rootly-teams.get
      outputParameters:
      - type: object
        mapping: $.
    - name: update-team
      description: Update team
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rootly-teams.patch
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
