naftiko: 1.0.0-alpha2
info:
  label: Rootly API — Services
  description: 'Rootly API — Services. 4 operations. Lead operation: List services. Self-contained Naftiko capability covering
    one Rootly business surface.'
  tags:
  - Rootly
  - Services
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ROOTLY_API_KEY: ROOTLY_API_KEY
capability:
  consumes:
  - type: http
    namespace: rootly-services
    baseUri: https://api.rootly.com/v1
    description: Rootly API — Services business capability. Self-contained, no shared references.
    resources:
    - name: services
      path: /services
      operations:
      - name: get
        method: GET
        description: List services
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: post
        method: POST
        description: Create service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: services-id
      path: /services/{id}
      operations:
      - name: get
        method: GET
        description: Get service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: patch
        method: PATCH
        description: Update service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.ROOTLY_API_KEY}}'
  exposes:
  - type: rest
    namespace: rootly-services-rest
    port: 8080
    description: REST adapter for Rootly API — Services. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/services
      name: services
      description: REST surface for services.
      operations:
      - method: GET
        name: get
        description: List services
        call: rootly-services.get
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: post
        description: Create service
        call: rootly-services.post
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/services/{id}
      name: services-id
      description: REST surface for services-id.
      operations:
      - method: GET
        name: get
        description: Get service
        call: rootly-services.get
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: patch
        description: Update service
        call: rootly-services.patch
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rootly-services-mcp
    port: 9090
    transport: http
    description: MCP adapter for Rootly API — Services. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-services
      description: List services
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rootly-services.get
      outputParameters:
      - type: object
        mapping: $.
    - name: create-service
      description: Create service
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rootly-services.post
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-service
      description: Get service
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: rootly-services.get
      outputParameters:
      - type: object
        mapping: $.
    - name: update-service
      description: Update service
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: rootly-services.patch
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
